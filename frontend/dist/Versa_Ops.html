<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Versa Ops — plataforma de gestão operacional para BPO Financeiro: clientes, entregas recorrentes, tarefas, agenda, apontamento de horas e histórico.">
  <meta name="author" content="Versa">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#201D1F" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F5F4F3" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex, nofollow">
  <title>Versa Ops — BPO Financeiro</title>

  <!-- Ícone da aba: marca "V" da Versa, embutido (sem arquivo externo) -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23201D1F'/%3E%3Cpolygon points='14,24 48,24 31,60' fill='%2377DE4A'/%3E%3Cpolygon points='54,24 88,24 71,60 50,90 46,60' fill='%2377DE4A' opacity='0.72'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23201D1F'/%3E%3Cpolygon points='14,24 48,24 31,60' fill='%2377DE4A'/%3E%3C/svg%3E">

  <style>
    /* ---------- Base ---------- */
    :root {
      --vo-bg: #201D1F;
      --vo-fg: #E3E3E3;
      --vo-muted: #9A928F;
      --vo-scroll: #403A3E;
      --vo-font: 'Century Gothic', 'Questrial', 'Avenir Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--vo-bg);
      color: var(--vo-fg);
      font-family: var(--vo-font);
      -webkit-text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior-y: none;
    }

    /* ---------- Área da aplicação ---------- */
    #root { max-width: 1500px; margin: 0 auto; padding: 0; }
    @media (min-width: 821px) { #root { padding: 14px; } }

    /* ---------- Estado de carregamento ---------- */
    .vo-boot {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; min-height: 60vh; color: var(--vo-muted); font-size: 14px;
    }
    .vo-boot__spinner {
      width: 26px; height: 26px; border-radius: 50%;
      border: 3px solid var(--vo-scroll); border-top-color: #77DE4A;
      animation: vo-spin 0.9s linear infinite;
    }
    @keyframes vo-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .vo-boot__spinner { animation: none; }
      * { transition: none !important; }
    }

    /* ---------- Aviso sem JavaScript ---------- */
    .vo-noscript {
      margin: 40px auto; max-width: 460px; padding: 20px 22px; line-height: 1.6;
      border: 1px solid var(--vo-scroll); border-radius: 12px; color: var(--vo-fg);
    }

    /* ---------- Formulários: 16px evita o zoom automático no iOS ---------- */
    input, select, textarea { font-size: 16px; font-family: var(--vo-font); }
    @media (min-width: 821px) { input, select, textarea { font-size: 13px; } }
    button { font-family: var(--vo-font); }
    :focus-visible { outline: 2px solid #77DE4A; outline-offset: 2px; border-radius: 6px; }

    /* ---------- Barras de rolagem ---------- */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-thumb { background: var(--vo-scroll); border-radius: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }

    /* ---------- Impressão: usa a tela como relatório ---------- */
    @media print {
      html, body { background: #fff; color: #000; }
      #root { max-width: none; padding: 0; }
      aside, header { display: none !important; }
    }
  </style>
</head>

<body>
  <!-- Ponto de montagem da aplicação (React) -->
  <div id="root">
    <div class="vo-boot" role="status" aria-live="polite">
      <div class="vo-boot__spinner" aria-hidden="true"></div>
      <span>Carregando Versa Ops…</span>
    </div>
  </div>

  <noscript>
    <div class="vo-noscript">
      <strong>JavaScript desativado.</strong><br>
      O Versa Ops precisa de JavaScript para funcionar. Ative-o nas configurações
      do navegador e recarregue esta página.
    </div>
  </noscript>
